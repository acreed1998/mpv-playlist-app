name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Remove preinstalled Yarn Classic, then enable Corepack
        run: |
          npm uninstall -g yarn
          corepack enable

      - name: Enable Corepack (selects the yarn version from package.json)
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: yarn

      - name: Enable Corepack again (for the Node that setup-node just installed)
        run: corepack enable

      - name: Show yarn version
        run: yarn --version

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: yarn install --immutable
      - run: yarn build # type-checks and builds the frontend (the Rust build needs it)

      - name: Run Rust tests
        run: cargo test
        working-directory: src-tauri
